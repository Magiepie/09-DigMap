name: Submit dug tiles
description: Add your dug coordinates to the shared map.
title: "[Dig upload] "
body:
  - type: markdown
    attributes:
      value: |
        Paste your readable player JSON below. Repeat uploads merge with your existing digs. Each tile is [x, y, plane].
  - type: textarea
    id: player-json
    attributes:
      label: Player JSON
      description: Include your RuneScape username and dug tiles. This submission and its data will be public.
      placeholder: '{"username":"PlayerName","tiles":[[3222,3218,0],[3223,3218,0]]}'
      render: json
    validations:
      required: true
