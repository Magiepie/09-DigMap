name: Submit dug tiles
description: Upload your player JSON file to add digs to the community map.
title: "[Dig upload] "
body:
  - type: markdown
    attributes:
      value: |
        Upload one .json file below. Drag it into the field, paste it, or use the attachment button. Wait until GitHub finishes uploading, then submit the Issue. Your player layer uses the GitHub account submitting this Issue; no username is needed in the JSON. Repeat uploads merge with your existing digs. Submissions are public.
  - type: textarea
    id: player-file
    attributes:
      label: Player JSON
      description: Paste the JSON copied by the map, or attach one .json file (maximum 5 MB).
      placeholder: Paste copied digs here, or attach your JSON file.
    validations:
      required: true


